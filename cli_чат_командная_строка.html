<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CLI Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        background: black;
        color: #ffffff;
        font-family: monospace;
        font-size: 16px;
    }
    #terminal {
        padding: 10px;
        height: calc(100vh - 60px); /* место под ввод */
        overflow-y: auto;
        white-space: pre-wrap;
    }
    #input {
        outline: none;
        border: none;
        background: black;
        color: #ffffff;
        font-family: monospace;
        font-size: 16px;
        width: 100%;
        position: fixed;
        bottom: 20px; /* немного сверху от низа */
        left: 0;
        padding: 5px 10px;
    }
</style>
</head>
<body>
<div id="terminal"></div>
<input id="input" autocomplete="off" autofocus placeholder="Введите сообщение и нажмите Enter">

<script>
    const terminal = document.getElementById('terminal');
    const input = document.getElementById('input');
    const username = 'user_' + Math.floor(Math.random() * 1000);
    const STORAGE_KEY = 'cli_chat_messages';

    function loadMessages() {
        const messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        terminal.textContent = '';
        messages.forEach(m => {
            terminal.textContent += `[${m.time}] ${m.user}: ${m.text}\n`;
        });
        terminal.scrollTop = terminal.scrollHeight;
    }

    function saveMessage(text) {
        const messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        messages.push({
            user: username,
            text: text,
            time: new Date().toLocaleTimeString()
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && input.value.trim() !== '') {
            saveMessage(input.value);
            input.value = '';
            loadMessages();
        }
    });

    window.addEventListener('storage', loadMessages);

    terminal.textContent = `CLI Chat запущен\nВаш ник: ${username}\n-------------------------\n`;
    loadMessages();
</script>
</body>
</html>
