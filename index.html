<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CLI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="terminal">
    <div class="output">
        <div class="line system">CLI Chat v1.0</div>
        <div class="line system">Введите сообщение ниже</div>

        <div class="line user">> Привет</div>
        <div class="line bot">Бот: Привет! 👋</div>

        <div class="line user">> Как дела?</div>
        <div class="line bot">Бот: Работаю стабильно</div>
    </div>

    <div class="input-line">
        <span class="prompt">&gt;</span>
        <input type="text" placeholder="введите команду..." disabled>
    </div>
</div>

</body>
</html>
